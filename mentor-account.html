<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="abc-api-origin" content="__API_ORIGIN__"><meta name="theme-color" content="#1463e5"><title>ABC | Ministry Service App · Akun Mentor</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/mentor-account.css"></head><body class="mentor-account"><main>
<header id="account-brand"></header><p class="eyebrow">AKUN MENTOR · UJI TERISOLASI</p><p id="account-feedback" role="status" aria-live="polite"></p>
<section id="account-login" class="panel"><h1>Masuk untuk melayani</h1><p>Gunakan akun yang sudah ditinjau dan ditautkan oleh penanggung jawab.</p><form id="account-login-form"><label for="account-username">Username<input id="account-username" required autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32"></label><label for="account-password">Kata sandi<input id="account-password" type="password" required autocomplete="current-password" maxlength="128"></label><button class="btn primary" type="submit">Masuk</button></form><p class="muted">Akun yang masih menunggu, ditolak atau belum ditautkan belum dapat menggunakan alur ini. Khusus akun dan data fiktif.</p></section>
<section id="account-profile" class="panel" hidden><div class="account-heading"><div><p class="eyebrow">SELAMAT MELAYANI</p><h1 id="account-name"></h1></div><button id="account-logout" class="btn">Keluar</button></div><div id="account-groups" class="account-groups"></div></section>
<section id="account-device" hidden></section><div id="account-attendance" hidden></div>
<dialog id="account-modal" aria-labelledby="account-modal-title"><h2 id="account-modal-title"></h2><form id="account-modal-form"></form></dialog>
</main><script type="module" src="/mentor-account.js"></script></body></html>
