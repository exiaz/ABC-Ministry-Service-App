<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABC · Visual Studio</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/msa-intake.css"><link rel="stylesheet" href="/visual-studio.css"><script type="module" src="/visual-studio.js"></script></head><body><main id="visual-main">
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 5 5 3-3 4 4"/></symbol><symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4h16v-4"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></symbol></defs></svg>
<header class="studio-header"><div><p class="studio-eyebrow">ABC MSA · Tampilan</p><h1>Visual Studio</h1></div><span class="studio-badge">Pilot lokal</span></header><p id="feedback" role="status" aria-live="polite" tabindex="-1">Memeriksa sesi…</p>
<section id="studio" hidden><div class="studio-layout"><aside class="settings-nav" aria-label="Bagian tampilan"><p class="studio-eyebrow">Pengaturan gambar</p><label for="slot">Bagian aplikasi</label><select id="slot"><option value="welcome">Selamat datang</option><option value="login">Login Mentor</option><option value="registration">Registrasi Mentor</option><option value="dashboard">Beranda Mentor</option></select><nav class="slot-navigation" aria-label="Pilih bagian"><button type="button" data-slot="welcome"><svg><use href="#i-image"/></svg><span>Selamat datang</span></button><button type="button" data-slot="login"><svg><use href="#i-image"/></svg><span>Login Mentor</span></button><button type="button" data-slot="registration"><svg><use href="#i-image"/></svg><span>Registrasi Mentor</span></button><button type="button" data-slot="dashboard"><svg><use href="#i-image"/></svg><span>Beranda Mentor</span></button></nav><p id="revision"></p><button type="button" id="reload" class="quiet"><svg><use href="#i-refresh"/></svg>Muat ulang</button></aside>
<div class="studio-workbench"><header class="section-header"><h2 id="section-title">Selamat datang</h2><span>Gambar halaman</span></header><form id="editor"><div class="editor-grid"><div class="image-settings"><section class="setting-group"><h3>Foto halaman</h3><button id="image-edit" type="button" class="image-edit" aria-label="Atur posisi dan zoom foto"><img id="image-thumb" alt="Pratinjau foto halaman"><span>Atur foto</span></button><button id="image-change" type="button" class="quiet"><svg aria-hidden="true"><use href="#i-upload"/></svg>Ganti gambar</button><input id="image" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" hidden><p class="compact-help">PNG, JPG, WebP · hingga 25 MiB</p><p id="published-state" class="compact-help"></p></section><section id="copy-settings" class="setting-group"><h3>Teks halaman masuk</h3><label for="headline">Headline</label><input id="headline" maxlength="120"><label for="description">Kalimat pembuka</label><textarea id="description" maxlength="300" rows="3"></textarea></section><details class="advanced"><summary>Pengaturan lanjutan</summary><label for="compression-size">Resolusi gambar</label><select id="compression-size"><option value="4096">Otomatis</option><option value="1920">1920 piksel</option><option value="1280">1280 piksel</option></select><p id="image-info" role="status"></p><label for="alt">Teks alternatif</label><input id="alt" maxlength="160"></details></div><section class="preview-panel"><div class="preview-toolbar"><h3>Pratinjau</h3><label for="mode" class="sr-only">Ukuran pratinjau</label><select id="mode"><option value="mobile">Mobile</option><option value="desktop">Desktop</option></select></div><p id="preview-state" role="status"></p><div class="preview-wrap" tabindex="0" aria-label="Area pratinjau tata letak"><iframe id="layout-preview" title="Pratinjau tata letak Opsi G" sandbox="allow-same-origin"></iframe></div></section></div><div class="save-panel simple-save"><p id="save-state" role="status"></p><div class="save-actions"><button type="button" id="cancel" class="quiet" hidden>Batalkan</button><button type="submit" id="save" disabled>Simpan perubahan</button><button type="button" id="retry" hidden>Coba lagi</button></div></div><dialog id="image-editor" aria-labelledby="crop-title"><h2 id="crop-title">Atur foto</h2><p class="compact-help">Geser foto, lalu sesuaikan zoom.</p><div id="crop-stage" tabindex="0" role="group" aria-label="Posisi foto. Geser atau gunakan tombol panah."><img id="crop-image" alt="" draggable="false"><span class="crop-crosshair" aria-hidden="true">+</span></div><input id="x" type="hidden" value="50"><input id="y" type="hidden" value="50"><div class="zoom-heading"><label for="zoom">Zoom</label><output id="zoom-value" for="zoom">100%</output></div><input id="zoom" type="range" min="1" max="3" step="0.01" value="1"><div class="crop-actions"><button type="button" id="position-reset" class="quiet">Tengah</button><div><button type="button" id="crop-cancel" class="quiet">Batal</button><button type="button" id="crop-apply">Terapkan</button></div></div></dialog></form></div></div></section><dialog id="save-result" aria-labelledby="save-result-title" aria-describedby="save-message"><h2 id="save-result-title">Berhasil disimpan</h2><p id="save-message"></p><button type="button" id="save-result-close" autofocus>OK</button></dialog></main></body></html>
