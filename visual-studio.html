<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABC · Visual Studio</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/msa-intake.css"><link rel="stylesheet" href="/visual-studio.css"><script type="module" src="/visual-studio.js"></script></head><body><main id="visual-main">
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 5 5 3-3 4 4"/></symbol><symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4h16v-4"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></symbol></defs></svg>
<header class="studio-header"><div><p class="studio-eyebrow">ABC MSA · Tampilan</p><h1>Visual Studio</h1></div><span class="studio-badge">Pilot lokal</span></header><p id="feedback" role="status" aria-live="polite" tabindex="-1">Memeriksa sesi…</p>
<section id="studio" hidden><div class="studio-layout"><aside class="settings-nav" aria-label="Bagian tampilan"><p class="studio-eyebrow">Pengaturan gambar</p><label for="slot">Bagian aplikasi</label><select id="slot"><option value="welcome">Selamat datang</option><option value="login">Login Mentor</option><option value="registration">Registrasi Mentor</option><option value="dashboard">Beranda Mentor</option></select><nav class="slot-navigation" aria-label="Pilih bagian"><button type="button" data-slot="welcome"><svg><use href="#i-image"/></svg><span>Selamat datang</span></button><button type="button" data-slot="login"><svg><use href="#i-image"/></svg><span>Login Mentor</span></button><button type="button" data-slot="registration"><svg><use href="#i-image"/></svg><span>Registrasi Mentor</span></button><button type="button" data-slot="dashboard"><svg><use href="#i-image"/></svg><span>Beranda Mentor</span></button></nav><p id="revision"></p><button type="button" id="reload" class="quiet"><svg><use href="#i-refresh"/></svg>Muat ulang</button></aside>
<div class="studio-workbench"><header class="section-header"><h2 id="section-title">Selamat datang</h2><span>Gambar halaman</span></header><form id="editor"><div class="editor-grid"><div class="image-settings"><section class="setting-group"><h3>Gambar & posisi</h3><div id="crop-stage" tabindex="0" role="img" aria-label="Posisi gambar. Geser untuk mengatur, atau gunakan tombol panah."><img id="crop-image" alt="" draggable="false"><span class="crop-crosshair" aria-hidden="true">+</span></div><p class="compact-help">Geser gambar atau atur posisi di bawah.</p><div class="position-controls"><label for="position-x">Horizontal</label><input id="position-x" type="range" min="0" max="100" value="50"><label for="position-y">Vertikal</label><input id="position-y" type="range" min="0" max="100" value="50"></div><div class="position-numbers"><label for="x">X <input id="x" type="number" min="0" max="100" step="1" value="50" required></label><label for="y">Y <input id="y" type="number" min="0" max="100" step="1" value="50" required></label><button id="position-reset" type="button" class="quiet">Tengah</button></div><label for="image" class="file-label"><svg><use href="#i-upload"/></svg>Ganti gambar</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" required><p class="compact-help">PNG, JPG, WebP · hingga 25 MiB</p><details class="advanced"><summary>Ukuran & aksesibilitas</summary><label for="compression-size">Resolusi</label><select id="compression-size"><option value="4096">Otomatis · 4096 px</option><option value="1920">Sedang · 1920 px</option><option value="1280">Ringkas · 1280 px</option></select><button type="button" id="compress" class="quiet">Kompres gambar</button><p id="image-info" role="status" aria-live="polite"></p></details><label for="alt">Teks alternatif</label><input id="alt" maxlength="160"></section>
<section class="setting-group"><h3>Status gambar</h3><div class="visual-columns"><div><div class="image-box"><img id="published" alt="" hidden></div><p class="status-label">Terbit</p><p id="published-state"></p></div><div><div class="image-box"><img id="draft" alt="" hidden></div><p class="status-label">Draf privat</p><p id="draft-state"></p></div></div></section></div>
<section class="preview-panel"><div class="preview-toolbar"><h3>Pratinjau</h3><label for="mode" class="sr-only">Ukuran pratinjau</label><select id="mode"><option value="mobile">Mobile</option><option value="desktop">Desktop</option></select></div><p id="preview-state" role="status"></p><div class="preview-wrap" tabindex="0" aria-label="Area pratinjau tata letak"><iframe id="layout-preview" title="Pratinjau tata letak Opsi G" sandbox="allow-same-origin"></iframe></div></section></div>
<section class="save-panel"><label for="reason">Catatan perubahan</label><textarea id="reason" minlength="5" maxlength="300" rows="2" placeholder="Apa yang diubah?" required></textarea><label class="check"><input id="confirm" type="checkbox" required> Konfirmasi perubahan</label><div class="save-actions"><button type="submit">Simpan draf</button><button type="button" id="publish">Terbitkan draf</button><button type="button" id="retry" hidden>Ulangi permintaan yang sama</button></div></section><details class="advanced restore-panel"><summary>Riwayat & pemulihan</summary><label for="target">Versi publikasi</label><select id="target"><option value="0">0 · Gambar bawaan</option></select><button type="button" id="revert" class="quiet">Kembalikan publikasi</button><div id="history"></div></details></form></div></div></section></main></body></html>
